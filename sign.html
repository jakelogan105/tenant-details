<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Review &amp; sign</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eceeec; color: #16211c; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .pg { max-width: 760px; margin: 0 auto; background: #fff; min-height: 100vh; padding: 34px 22px 120px; box-shadow: 0 0 60px rgba(20,30,24,0.12); }
  .k { font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.22em; font-size: 10px; color: #5a6b5e; font-weight: 700; }
  h1 { font-size: 24px; margin: 8px 0 0; letter-spacing: -0.01em; }
  .meta { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: #4c584f; }
  .meta b { color: #16211c; }
  h2 { font-size: 11px; letter-spacing: 0.22em; color: #5a6b5e; margin: 30px 0 2px; }
  .it { border-top: 1px solid #e4e9e4; padding: 12px 0 14px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nm { font-size: 14px; font-weight: 650; }
  .chip { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; border-radius: 999px; padding: 2px 9px; }
  .note { font-size: 12px; color: #4c584f; margin-top: 4px; line-height: 1.55; }
  .phs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .phs img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; border: 1px solid #dfe5df; }
  .sig { margin-top: 40px; border-top: 3px solid #16211c; padding-top: 16px; }
  .sig p { font-size: 12px; color: #4c584f; line-height: 1.6; }
  input[type=text] { width: 100%; font-size: 16px; padding: 12px; border: 1px solid #c9d2c9; border-radius: 10px; font-family: inherit; }
  #pad { width: 100%; height: 160px; border: 1px dashed #9aa89a; border-radius: 10px; touch-action: none; background: #fbfcfb; }
  .btn { width: 100%; margin-top: 12px; background: #16211c; color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn[disabled] { opacity: 0.45; }
  .ghost { background: none; border: none; color: #5a6b5e; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 6px 0; font-family: inherit; }
  .sigtab { flex: 1; background: #fbfcfb; border: 1px solid #c9d2c9; border-radius: 10px; padding: 10px 6px; font-size: 12.5px; font-weight: 700; color: #5a6b5e; cursor: pointer; font-family: inherit; }
  .sigtab.on { background: #16211c; border-color: #16211c; color: #fff; }
  .msg { text-align: center; padding: 80px 20px; font-size: 14px; color: #4c584f; line-height: 1.6; }
  @media print { .btn, .ghost, #__pbtn { display: none !important; } body { background: #fff; } .pg { box-shadow: none; min-height: 0; padding: 0; } }
  .ok { color: #15803d; font-weight: 700; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
<div class="pg" id="app"><div class="msg">Loading your document…</div></div>
<script src="config.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function msg(html) { app.innerHTML = '<div class="msg">' + html + '</div>'; }

  // in-page photo viewer: full-res originals open in an overlay instead of the raw storage URL
  (function () {
    var lb = document.createElement('div');
    lb.id = '__lbox';
    lb.style.cssText = 'display:none;position:fixed;inset:0;z-index:99;background:rgba(10,14,12,0.94);align-items:center;justify-content:center;padding:18px;cursor:zoom-out;';
    lb.innerHTML = '<img style="max-width:100%;max-height:calc(100% - 44px);object-fit:contain;border-radius:6px;box-shadow:0 18px 60px rgba(0,0,0,0.6);" alt="">' +
      '<div style="position:absolute;top:12px;right:14px;display:flex;gap:10px;align-items:center;">' +
      '<a id="__lbdl" href="#" target="_blank" rel="noopener" style="color:#cfe2d6;font-size:12px;font-weight:700;text-decoration:none;background:rgba(255,255,255,0.12);border-radius:999px;padding:8px 14px;" onclick="event.stopPropagation()">open original ↗</a>' +
      '<button style="background:rgba(255,255,255,0.12);border:none;border-radius:999px;color:#fff;font-size:16px;width:36px;height:36px;cursor:pointer;">✕</button></div>' +
      '<div id="__lbwait" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#9fb3a6;font-size:13px;">loading full resolution…</div>';
    document.body.appendChild(lb);
    var im = lb.querySelector('img'), wait = lb.querySelector('#__lbwait');
    function close() { lb.style.display = 'none'; im.src = ''; }
    lb.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    im.addEventListener('load', function () { wait.style.display = 'none'; });
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a.__lb') : null;
      if (!a) return;
      e.preventDefault();
      wait.style.display = 'block';
      im.src = a.href;
      lb.querySelector('#__lbdl').href = a.href;
      lb.style.display = 'flex';
    });
  })();

  var parts = (location.hash || '').slice(1).split('&');
  var URL0, KEY, TOKEN;
  if (parts.length >= 3) {   // legacy long link: #<url>&<key>&<token>
    URL0 = decodeURIComponent(parts[0] || '').replace(/\/$/, ''); KEY = decodeURIComponent(parts[1] || ''); TOKEN = parts[2] || '';
  } else {   // short link: #<token> — config.js (same file the intake form uses) carries the address
    var C = window.INTAKE_CFG || {};
    URL0 = String(C.u || '').replace(/\/$/, ''); KEY = String(C.k || ''); TOKEN = decodeURIComponent(parts[0] || '');
  }
  if (!URL0 || !KEY || !TOKEN) { msg('This link is incomplete.<br>Please ask your landlord or agent to send it again.'); return; }
  var H = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };

  var CT = { new: ['NEW', '#0e7490', '#e0f4fa'], good: ['GOOD', '#15803d', '#e3f6e9'], worn: ['WORN', '#a16207', '#faf3d9'], damaged: ['DAMAGED', '#b91c1c', '#fbe7e5'] };
  var TN = { checkin: 'Inventory & Check-in', checkout: 'Check-out', interim: 'Interim inspection', general: 'Condition' };

  // canonical terms — identical wording to the in-app print version
  var TERMS = '<section style="margin-top:22px;">'
    + '<h2 style="font-size:11px;letter-spacing:0.22em;color:#5a6b5e;border-bottom:2px solid #16211c;padding-bottom:5px;margin:0 0 6px;">LANDLORD &amp; TENANT — HOW THIS REPORT IS USED</h2>'
    + '<h3 style="font-size:10.5px;letter-spacing:0.18em;color:#5a6b5e;margin:16px 0 4px;">ABOUT THIS REPORT</h3>'
    + '<p style="font-size:12px;color:#3d4a40;line-height:1.65;margin:6px 0;">This Schedule of Condition provides a fair and objective record of the general condition of the property, its contents, fixtures and fittings at the date shown. It is used at the start and end of the tenancy to determine whether there is damage or missing items which would have to be paid for by the tenant, reducing disputes and enabling the deposit to be returned promptly. Each item is photographed and labelled. <b>All items are considered to be in good condition unless stated otherwise.</b> Fixtures and fittings in good condition are not separately labelled but appear in the general photographs of each room.</p>'
    + '<h3 style="font-size:10.5px;letter-spacing:0.18em;color:#5a6b5e;margin:16px 0 4px;">CHALLENGING THE REPORT</h3>'
    + '<p style="font-size:12px;color:#3d4a40;line-height:1.65;margin:6px 0;">Both landlord and tenant have <b>seven days</b> to challenge the contents of this report, starting on the date of its production or the start of the tenancy, whichever is later. If the report is not challenged during this period it will be assumed accepted. Please raise any comments with the landlord or managing agent before signing.</p>'
    + '<h3 style="font-size:10.5px;letter-spacing:0.18em;color:#5a6b5e;margin:16px 0 4px;">WHAT THE TENANT PAYS FOR</h3>'
    + '<p style="font-size:12px;color:#3d4a40;line-height:1.65;margin:6px 0;">The tenancy agreement determines costs for the tenant\u2019s account. As a general rule the tenant must pay the replacement cost of missing items, for damage beyond normal wear and tear, costs of returning the property and contents to the same state of cleanliness as at the start of the tenancy, removal of the tenant\u2019s possessions or rubbish, and costs of returning items to their original places.</p>'
    + '<h3 style="font-size:10.5px;letter-spacing:0.18em;color:#5a6b5e;margin:16px 0 4px;">WHAT THIS INSPECTION DOES NOT COVER</h3>'
    + '<p style="font-size:12px;color:#3d4a40;line-height:1.65;margin:6px 0;">The inspection is non-invasive: carpets, floorcoverings and floorboards are not lifted, large furniture is not moved, secured panels and electrical fittings are not removed. Common parts, exterior structural elements, roof spaces, cellars and locked or inaccessible areas are not inspected.</p>'
    + '<h3 style="font-size:10.5px;letter-spacing:0.18em;color:#5a6b5e;margin:16px 0 4px;">DISCLAIMER</h3>'
    + '<p style="font-size:12px;color:#3d4a40;line-height:1.65;margin:6px 0;">This report is a documented record that the items listed exist at the property at the date shown, and of their superficial condition. It is not a structural survey, nor a guarantee of the adequacy or safety of any furniture, equipment or contents, and no attempt is made to identify makers, materials or periods. The person preparing it is not a qualified surveyor, electrician or plumber. Smoke and heat detectors are not tested; it is the tenant\u2019s responsibility to test these regularly. Any dispute will be dealt with in accordance with the tenancy agreement.</p>'
    + '<h2 style="font-size:11px;letter-spacing:0.22em;color:#5a6b5e;border-bottom:2px solid #16211c;padding-bottom:5px;margin:24px 0 6px;">LANDLORD &amp; TENANT RESPONSIBILITIES</h2>'
    + '<p style="font-size:12px;color:#3d4a40;line-height:1.65;margin:6px 0;">General responsibilities are summarised below \u2014 your tenancy agreement may specify certain responsibilities differently.</p>'
    + '__RESP__'
    + '</section>';
  var RESP_DATA = [["Internal decoration",[],["keeping the interior of the dwelling in reasonable decorative order"]],["External works",["repairs to garden paths, walls, fences and gates where installed by the landlord","maintenance of communal amenity areas, unless the responsibility of the local authority","structural repairs to walls, outside doors, windows (but not replacement of glass), roofs, chimneys, valleys, gutters, downpipes and house drains (excluding cleaning of gullies)","external paintwork"],["care and upkeep of gardens and hedges","cleaning of gully traps"]],["Electrical repairs",["electrical wiring","repair of electrical appliances, fires and heaters fitted by the landlord","door entry systems to communal blocks","ceiling roses, lamp holders and flexes","socket outlets and switches"],["repair of appliances, fires and heaters not installed by the landlord","door bells and plug tops on appliances","re-setting of trips and replacement of fuses, except main service fuses (grid supplier)"]],["Cooking & heating appliances",["repairs to landlord-installed cookers, stoves and room heaters","fire hearth and surrounds"],[]],["Plumbing",["clearing blocked sewers, drains and external waste pipes, other than blockages through tenant misuse","boilers and hot water cylinders","pipe work, radiators, fittings and valves"],["stoppers and chains for baths, sinks and basins","replacement of wash basins, WC bowls and seats, baths, sinks and drainers (except fair wear and tear or faulty installation)"]],["Doors & windows",["window frames, sashes and window furniture","repair of defective internal and external doors, saddles and door frames","hinges, locks, handles and letter boxes on external doors"],["hinges, locks and handles to internal doors","kitchen and bedroom unit doors, hinges, handles and catches","draught proofing of doors and windows","replacement of broken glass"]],["Structural & other repairs",["walls, staircases and structural timbers, roof, chimney and rainwater goods","wall and floor tiling","architraves, skirting boards, sills and internal decorative woodwork","airbricks, ventilators and roofspace insulation","timber rot"],["sweeping chimneys, and any work required through failure to sweep","internal plaster cracks on walls and ceilings"]],["Fire safety standards",["follow safety regulations and provide required smoke and carbon monoxide alarms","ensure tenants have access to escape routes at all times","ensure supplied furniture and furnishings are fire safe","provide fire alarms and extinguishers in a large HMO"],["keep fire alarms, smoke detectors and CO alarms in working order — never remove batteries or cover them; report faulty alarms to the landlord as soon as possible"]],["Gas installation safety",["arrange maintenance by a Gas Safe registered engineer for all landlord-owned pipe work, appliances and flues","arrange an annual gas safety check every 12 months, keep the record for 2 years, and issue a copy to each tenant within 28 days (and to new tenants before move-in)"],[]],["Electrical installation safety",["ensure the electrical installation is safe at move-in and maintained safe throughout the tenancy","periodic inspection every five years for an HMO","ensure any appliance provided is safe and carries at least the CE marking"],[]],["Energy performance",["provide the property’s current Energy Performance Certificate (EPC) to each new tenant — valid for ten years"],[]],["Smoke & CO alarms",["fit a smoke alarm on every floor with living accommodation, and a CO alarm in any room with a fixed combustion appliance (gas cookers excluded), including open fires","test alarms at the start of each new tenancy; repair or replace faulty alarms as soon as reasonably practicable once reported"],[]]];
  var RESP = RESP_DATA.map(function (r) {
    var li = function (a) { return a.map(function (x) { return '<li>' + x + '</li>'; }).join(''); };
    return '<div style="break-inside:avoid;margin-bottom:13px;">'
      + '<div style="font-size:12px;font-weight:750;border-bottom:1px solid #e4e9e4;padding-bottom:3px;margin-bottom:5px;">' + r[0] + '</div>'
      + (r[1].length ? '<div style="font-size:9px;font-weight:700;letter-spacing:0.14em;color:#5a6b5e;">THE LANDLORD</div><ul style="margin:2px 0 6px;padding-left:16px;font-size:11.5px;color:#3d4a40;line-height:1.55;">' + li(r[1]) + '</ul>' : '')
      + (r[2].length ? '<div style="font-size:9px;font-weight:700;letter-spacing:0.14em;color:#5a6b5e;">THE TENANT</div><ul style="margin:2px 0 0;padding-left:16px;font-size:11.5px;color:#3d4a40;line-height:1.55;">' + li(r[2]) + '</ul>' : '')
      + '</div>';
  }).join('');
  RESP = '<div style="columns:2;column-gap:26px;">' + RESP + '</div>';
  TERMS = TERMS.replace('__RESP__', RESP);

  function chip(c) {
    var m = CT[c];
    return m ? '<span class="chip" style="color:' + m[1] + ';background:' + m[2] + ';border:1px solid ' + m[1] + '33;">' + m[0] + '</span>'
             : '<span style="font-size:9px;color:#9aa39b;">— not rated</span>';
  }
  function renderLease(rep) {
    var h = '<style>' + (rep.docCss || '') + '</style>'
      + '<div class="k" style="margin-bottom:16px;">TENANCY AGREEMENT' + (rep.ref ? ' — ' + esc(rep.ref) : '') + (rep.viewOnly ? ' — SIGNED COPY' : ' — PLEASE REVIEW &amp; SIGN') + '</div>'
      + (rep.docHtml || '<div class="msg">Document missing — ask for a fresh link.</div>');
    if (rep.viewOnly) {
      h += '<div id="__pbtn" style="margin-top:26px;"><button class="btn" style="width:auto;padding:13px 24px;" onclick="print()">Print / save PDF</button></div>';
      app.innerHTML = h;
      return;
    }
    h += '<div class="sig"><div class="k">DECLARATION</div>'
      + '<p>I confirm I have read this tenancy agreement in full, understand its terms, and agree to be legally bound by them from the start date shown. My electronic signature below has the same legal effect as a handwritten signature. If anything looks wrong, contact your landlord or agent <b>before</b> signing.</p>'
      + (rep.forSigner ? '<div style="font-size:13px;color:#16211c;margin-top:14px;">Signing as <b>' + esc(rep.forSigner) + '</b><span style="color:#5a6b5e;"> — if that isn\u2019t you, do not sign; ask for your own link.</span></div>' : '')
      + '<label style="font-size:12px;font-weight:700;display:block;margin:14px 0 6px;">Your full name</label>'
      + '<input type="text" id="nm" autocomplete="name" placeholder="Type your full legal name" value="' + esc(rep.forSigner || '') + '">'
      + '<label style="font-size:12px;font-weight:700;display:block;margin:16px 0 6px;">Signature</label>'
      + SIG_UI
      + '<button class="btn" id="go" type="button">Agree &amp; sign</button>'
      + '<div id="out" style="margin-top:10px;font-size:13px;text-align:center;"></div></div>';
    app.innerHTML = h;
    wireSignature();
  }
  // ── tenant comments: notes + photos added per room, sent with the signature ──
  var MYC = [];
  function tcExisting(sec, rep) {
    var prior = (rep.tenantComments || []).filter(function (c) { return c.sec === sec; });
    if (!prior.length) return '';
    var h = '';
    prior.forEach(function (c) {
      h += '<div style="border:1px solid #e3d9b8;background:#fbf8ee;border-radius:10px;padding:10px 12px;margin-top:10px;">'
        + '<div style="font-size:9px;font-weight:700;letter-spacing:0.14em;color:#8a7a3a;">TENANT COMMENT' + (c.by ? ' — ' + esc(c.by) : '') + (c.at ? ' · ' + new Date(c.at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '') + '</div>'
        + (c.text ? '<div style="font-size:12px;color:#3d4a40;line-height:1.6;margin-top:4px;">' + esc(c.text) + '</div>' : '');
      if (c.photos && c.photos.length) {
        h += '<div class="phs" style="margin-top:8px;">';
        c.photos.forEach(function (p) { if (/^data:image\//.test(p)) h += '<img src="' + p + '" alt="">'; });
        h += '</div>';
      }
      h += '</div>';
    });
    return h;
  }
  function tcBlock(sec) {
    var id = 'tc' + sec.replace(/[^\w]/g, '_');
    return '<div id="' + id + '" data-sec="' + esc(sec) + '" class="tcwrap" style="margin-top:10px;">'
      + '<div class="tclist"></div>'
      + '<button type="button" class="tcadd ghost" style="font-size:12px;">+ Add a comment about ' + esc(sec) + '</button>'
      + '<div class="tcform" style="display:none;border:1px solid #c9d2c9;border-radius:10px;background:#fbfcfb;padding:12px;margin-top:6px;">'
      + '<textarea class="tctext" rows="3" placeholder="Your comment — e.g. small scuff on the wall behind the door not shown in the photos" style="width:100%;box-sizing:border-box;border:1px solid #c9d2c9;border-radius:8px;padding:9px 10px;font:inherit;font-size:13px;"></textarea>'
      + '<div class="tcthumbs phs" style="margin-top:8px;"></div>'
      + '<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;">'
      + '<button type="button" class="tcphoto ghost" style="font-size:12px;">\ud83d\udcf7 Add your photos</button>'
      + '<input type="file" class="tcfile" accept="image/*" multiple style="display:none;">'
      + '<span style="flex:1"></span>'
      + '<button type="button" class="tccancel ghost" style="font-size:12px;">cancel</button>'
      + '<button type="button" class="tcsave btn" style="width:auto;padding:9px 18px;margin-top:0;font-size:13px;">Save comment</button>'
      + '</div></div></div>';
  }
  function tcResize(file) {
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(img.src);
        var sc = Math.min(1, 1200 / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function () { res(''); };
      img.src = URL.createObjectURL(file);
    });
  }
  function wireComments() {
    document.querySelectorAll('.tcwrap').forEach(function (w) {
      var sec = w.getAttribute('data-sec'), form = w.querySelector('.tcform'), add = w.querySelector('.tcadd');
      var pending = [];
      var thumbs = w.querySelector('.tcthumbs'), list = w.querySelector('.tclist');
      add.onclick = function () { form.style.display = ''; add.style.display = 'none'; };
      w.querySelector('.tccancel').onclick = function () { form.style.display = 'none'; add.style.display = ''; w.querySelector('.tctext').value = ''; pending = []; thumbs.innerHTML = ''; };
      w.querySelector('.tcphoto').onclick = function () { w.querySelector('.tcfile').click(); };
      w.querySelector('.tcfile').onchange = function () {
        var fs = Array.prototype.slice.call(w.querySelector('.tcfile').files || []);
        fs.forEach(function (f) { tcResize(f).then(function (d) { if (d) { pending.push(d); var im = document.createElement('img'); im.src = d; thumbs.appendChild(im); } }); });
        w.querySelector('.tcfile').value = '';
      };
      w.querySelector('.tcsave').onclick = function () {
        var txt = w.querySelector('.tctext').value.trim();
        if (!txt && !pending.length) return;
        var c = { sec: sec, text: txt, photos: pending.slice(), at: new Date().toISOString() };
        MYC.push(c);
        var d = document.createElement('div');
        d.style.cssText = 'border:1px solid #e3d9b8;background:#fbf8ee;border-radius:10px;padding:10px 12px;margin-bottom:8px;';
        d.innerHTML = '<div style="font-size:9px;font-weight:700;letter-spacing:0.14em;color:#8a7a3a;">YOUR COMMENT — sent when you sign <button type="button" style="float:right;background:none;border:none;color:#b91c1c;font-size:11px;cursor:pointer;text-decoration:underline;">remove</button></div>'
          + (txt ? '<div style="font-size:12px;color:#3d4a40;line-height:1.6;margin-top:4px;"></div>' : '');
        if (txt) d.querySelector('div + div').textContent = txt;
        if (c.photos.length) { var ph = document.createElement('div'); ph.className = 'phs'; ph.style.marginTop = '8px'; c.photos.forEach(function (p) { var im = document.createElement('img'); im.src = p; ph.appendChild(im); }); d.appendChild(ph); }
        d.querySelector('button').onclick = function () { MYC = MYC.filter(function (x) { return x !== c; }); d.remove(); };
        list.appendChild(d);
        w.querySelector('.tctext').value = ''; pending = []; thumbs.innerHTML = '';
        form.style.display = 'none'; add.style.display = '';
      };
    });
  }
  function render(rep, row) {
    if (rep.kind === 'lease') { renderLease(rep); return; }
    // like-for-like: view-only reports carry the exact in-app print document —
    // render that verbatim in a full-page frame instead of rebuilding a layout
    if (rep.viewOnly && rep.docHtml) {
      document.body.style.margin = '0';
      var wrap = document.createElement('iframe');
      wrap.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;';
      wrap.srcdoc = rep.docHtml;
      app.replaceWith(wrap);
      return;
    }
    var d = new Date(rep.date + 'T12:00');
    var ds = isFinite(d) ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : rep.date;
    var h = '<header style="border-bottom:3px solid #16211c;padding-bottom:18px;">'
      + '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;">'
      + '<div class="k" style="flex:1;min-width:200px;">' + esc((TN[rep.type] || 'CONDITION').toUpperCase()) + ' REPORT</div>'
      + (rep.ref ? '<div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#7a857c;">' + esc(rep.ref) + '</div>' : '')
      + '<div style="font-size:10px;font-weight:700;letter-spacing:0.08em;color:' + (rep.viewOnly ? '#4c584f' : '#b45309') + ';border:1px solid currentColor;border-radius:999px;padding:3px 10px;">' + (rep.viewOnly ? 'SIGNED COPY' : 'PLEASE REVIEW &amp; SIGN') + '</div></div>'
      + '<h1 style="margin:10px 0 2px;">' + esc(rep.addr) + '</h1>'
      + (rep.summary ? '<div style="font-size:12.5px;font-style:italic;color:#4c584f;margin:6px 0 0;">&ldquo;' + esc(rep.summary) + '&rdquo;</div>' : '')
      + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 22px;margin-top:14px;">'
      + '<div><div style="font-size:9.5px;font-weight:700;letter-spacing:0.09em;color:#7a857c;">REPORT DATE</div><div style="font-size:13.5px;font-weight:700;">' + esc(ds) + '</div></div>'
      + (function () { if (!rep.startDate) return ''; var sd = new Date(rep.startDate + 'T12:00'); return isFinite(sd) ? '<div><div style="font-size:9.5px;font-weight:700;letter-spacing:0.09em;color:#7a857c;">TENANCY START</div><div style="font-size:13.5px;font-weight:700;">' + esc(sd.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })) + '</div></div>' : ''; })()
      + (rep.tenant ? '<div><div style="font-size:9.5px;font-weight:700;letter-spacing:0.09em;color:#7a857c;">TENANT</div><div style="font-size:13.5px;font-weight:700;">' + esc(rep.tenant) + '</div></div>' : '')
      + (rep.landlord ? '<div><div style="font-size:9.5px;font-weight:700;letter-spacing:0.09em;color:#7a857c;">LANDLORD / AGENT</div><div style="font-size:13.5px;font-weight:700;">' + esc(rep.landlord) + '</div>' + (rep.landlordAddr ? '<div style="font-size:11px;color:#4c584f;">' + esc(rep.landlordAddr) + '</div>' : '') + '</div>' : '')

    (rep.secs || []).forEach(function (s) {
      h += '<h2>' + esc(s.name).toUpperCase() + '</h2>';
      (s.items || []).forEach(function (it) {
        var extra = '';
        if (s.kind === 'meters' && it.reading) extra = '<span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;">reading: ' + esc(it.reading) + '</span>';
        if (s.kind === 'keys' && it.reading) extra = '<span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;">× ' + esc(it.reading) + '</span>';

      var sl = (rep.sigs || []).slice().map(function (s) { return Object.assign({ role: 'Tenant' }, s); });

        h += '<div style="min-width:200px;margin-top:14px;">'
          + (s.img ? '<img src="' + s.img + '" alt="signature" style="height:56px;display:block;">' : '<div style="height:56px;"></div>')

    h += '<div class="sig"><div class="k">DECLARATION</div>'
      + '<p>I confirm I have reviewed this report and agree it fairly records the condition of the property at the date shown, <b>subject to any comments I have added above</b>, which form part of this report. Photographs shown are date-stamped copies; full-resolution originals are retained. If anything looks wrong, add a comment to the relevant room or contact your landlord or agent <b>before</b> signing — you have seven days from receipt to raise queries.</p>'
      + (rep.forSigner ? '<div style="font-size:13px;color:#16211c;margin-top:14px;">Signing as <b>' + esc(rep.forSigner) + '</b>' + '<span style="color:#5a6b5e;"> — if that isn\u2019t you, do not sign; ask for your own link.</span></div>' : '')
      + '<label style="font-size:12px;font-weight:700;display:block;margin:14px 0 6px;">Your full name</label>'
      + '<input type="text" id="nm" autocomplete="name" placeholder="Type your full legal name" value="' + esc(rep.forSigner || '') + '">'

  }

  var SIG_UI = '<div style="display:flex;gap:6px;margin-bottom:8px;">'
    + '<button type="button" class="sigtab on" id="tabDraw">✍ Draw</button>'
    + '<button type="button" class="sigtab" id="tabPhoto">📷 Photo of your signature</button></div>'
    + '<div id="drawWrap"><canvas id="pad"></canvas>'
    + '<button class="ghost" id="clr" type="button">clear signature</button></div>'
    + '<div id="photoWrap" style="display:none;">'
    + '<div id="phPrompt" style="border:1px dashed #9aa89a;border-radius:10px;background:#fbfcfb;padding:18px 14px;text-align:center;">'
    + '<p style="font-size:12.5px;color:#4c584f;line-height:1.6;margin:0 0 10px;">Sign your name in <b>dark ink on plain white paper</b>, then photograph it. The signature is lifted off the paper automatically.</p>'
    + '<button type="button" class="btn" id="phBtn" style="margin-top:0;width:auto;padding:12px 22px;">📷 Take / choose photo</button>'
    + '<input type="file" id="phIn" accept="image/*" style="display:none;"></div>'
    + '<div id="phShow" style="display:none;border:1px solid #c9d2c9;border-radius:10px;background:#fbfcfb;padding:10px;text-align:center;">'
    + '<img id="phImg" alt="your signature" style="max-width:100%;max-height:150px;display:inline-block;">'
    + '<div><button class="ghost" id="phRedo" type="button">retake photo</button></div></div>'
    + '<div id="phErr" style="display:none;font-size:12px;color:#b91c1c;margin-top:8px;"></div></div>';

  // lift dark ink off a photographed page: adaptive local threshold (survives shadows
  // and uneven lighting — each pixel is compared to its own neighbourhood, so smooth
  // gradients never read as ink), then a speck filter drops dust and paper grain
  function liftSignature(img) {
    var W = Math.min(img.naturalWidth || img.width, 1100);
    var sc = W / (img.naturalWidth || img.width), Hh = Math.round((img.naturalHeight || img.height) * sc);
    var c = document.createElement('canvas'); c.width = W; c.height = Hh;
    var x = c.getContext('2d'); x.drawImage(img, 0, 0, W, Hh);
    var d = x.getImageData(0, 0, W, Hh), p = d.data, n = W * Hh;
    var g = new Float32Array(n);
    for (var i = 0; i < n; i++) g[i] = p[i * 4] * 0.299 + p[i * 4 + 1] * 0.587 + p[i * 4 + 2] * 0.114;
    var iw = W + 1, integ = new Float64Array(iw * (Hh + 1));
    for (var y = 0; y < Hh; y++) { var rs = 0; for (var xx = 0; xx < W; xx++) { rs += g[y * W + xx]; integ[(y + 1) * iw + xx + 1] = integ[y * iw + xx + 1] + rs; } }
    var hw = Math.max(8, Math.round(Math.min(W, Hh) / 28));
    var ink = new Uint8Array(n), diffA = new Float32Array(n), inkN = 0;
    for (var y = 0; y < Hh; y++) for (var xx = 0; xx < W; xx++) {
      var x0 = Math.max(0, xx - hw), x1 = Math.min(W - 1, xx + hw), y0 = Math.max(0, y - hw), y1 = Math.min(Hh - 1, y + hw);
      var area = (x1 - x0 + 1) * (y1 - y0 + 1);
      var s = integ[(y1 + 1) * iw + x1 + 1] - integ[y0 * iw + x1 + 1] - integ[(y1 + 1) * iw + x0] + integ[y0 * iw + x0];
      var mean = s / area, k = y * W + xx, diff = mean - g[k];
      if (diff > 14 && g[k] < mean * 0.9) { ink[k] = 1; diffA[k] = diff; inkN++; }
    }
    if (!inkN || inkN > n * 0.4) return null;
    // connected components — drop tiny specks
    var lbl = new Int32Array(n), stack = [], comps = [], cid = 0;
    for (var i = 0; i < n; i++) {
      if (!ink[i] || lbl[i]) continue;
      cid++; var px = [i]; stack.length = 0; stack.push(i); lbl[i] = cid;
      while (stack.length) {
        var k = stack.pop(), ky = (k / W) | 0, kx = k % W;
        if (kx > 0 && ink[k - 1] && !lbl[k - 1]) { lbl[k - 1] = cid; stack.push(k - 1); px.push(k - 1); }
        if (kx < W - 1 && ink[k + 1] && !lbl[k + 1]) { lbl[k + 1] = cid; stack.push(k + 1); px.push(k + 1); }
        if (ky > 0 && ink[k - W] && !lbl[k - W]) { lbl[k - W] = cid; stack.push(k - W); px.push(k - W); }
        if (ky < Hh - 1 && ink[k + W] && !lbl[k + W]) { lbl[k + W] = cid; stack.push(k + W); px.push(k + W); }
      }
      comps.push(px);
    }
    var minKeep = Math.max(26, inkN * 0.004);
    var out = x.createImageData(W, Hh), q = out.data;
    var minX = W, minY = Hh, maxX = 0, maxY = 0, kept = 0;
    for (var ci = 0; ci < comps.length; ci++) {
      var px = comps[ci]; if (px.length < minKeep) continue;
      for (var j = 0; j < px.length; j++) {
        var k = px[j]; kept++;
        q[k * 4] = 22; q[k * 4 + 1] = 33; q[k * 4 + 2] = 28;
        q[k * 4 + 3] = Math.min(255, (diffA[k] - 8) * 9 + 80);
        var kx = k % W, ky = (k / W) | 0;
        if (kx < minX) minX = kx; if (kx > maxX) maxX = kx; if (ky < minY) minY = ky; if (ky > maxY) maxY = ky;
      }
    }
    if (kept < 80) return null;
    x.putImageData(out, 0, 0);
    var pad = 12; minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad); maxX = Math.min(W - 1, maxX + pad); maxY = Math.min(Hh - 1, maxY + pad);
    var cw = maxX - minX + 1, ch = maxY - minY + 1;
    var oW = 900, oH = Math.max(140, Math.round(ch * (oW / cw)));
    if (oH > 440) { oH = 440; oW = Math.round(cw * (oH / ch)); }
    var o = document.createElement('canvas'); o.width = oW; o.height = oH;
    o.getContext('2d').drawImage(c, minX, minY, cw, ch, 0, 0, oW, oH);
    return o.toDataURL('image/png');
  }

  function wireSignature() {
    var pad = document.getElementById('pad'), ctx, drawn = false;
    function fit() {
      var r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      pad.width = Math.round(r.width * dpr); pad.height = Math.round(r.height * dpr);
      ctx = pad.getContext('2d'); ctx.scale(dpr, dpr);
      ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#16211c';
    }
    fit();
    var mode = 'draw', photoSig = null;
    var tabD = document.getElementById('tabDraw'), tabP = document.getElementById('tabPhoto');
    var wrapD = document.getElementById('drawWrap'), wrapP = document.getElementById('photoWrap');
    function setMode(m) { mode = m; tabD.className = 'sigtab' + (m === 'draw' ? ' on' : ''); tabP.className = 'sigtab' + (m === 'photo' ? ' on' : '');
      wrapD.style.display = m === 'draw' ? '' : 'none'; wrapP.style.display = m === 'photo' ? '' : 'none'; if (m === 'draw') fit0(); }
    function fit0() { if (!drawn) fit(); }
    tabD.onclick = function () { setMode('draw'); };
    tabP.onclick = function () { setMode('photo'); };
    var phIn = document.getElementById('phIn'), phErr = document.getElementById('phErr');
    document.getElementById('phBtn').onclick = function () { phIn.click(); };
    document.getElementById('phRedo').onclick = function () { photoSig = null; document.getElementById('phShow').style.display = 'none'; document.getElementById('phPrompt').style.display = ''; phIn.value = ''; };
    phIn.onchange = function () {
      var f = phIn.files && phIn.files[0]; if (!f) return;
      phErr.style.display = 'none';
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(img.src);
        var res = liftSignature(img);
        if (!res) { phErr.textContent = 'Couldn\u2019t find a signature in that photo — use dark ink on plain white paper, fill the frame with the page, and avoid shadows.'; phErr.style.display = ''; return; }
        photoSig = res;
        document.getElementById('phImg').src = res;
        document.getElementById('phPrompt').style.display = 'none';
        document.getElementById('phShow').style.display = '';
      };
      img.onerror = function () { phErr.textContent = 'Could not read that photo — try again.'; phErr.style.display = ''; };
      img.src = URL.createObjectURL(f);
    };
    var down = false, lx = 0, ly = 0;
    function pos(e) { var r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

    var out = document.getElementById('out'), btn = document.getElementById('go');
    btn.onclick = function () {
      var nm = document.getElementById('nm').value.trim();
      if (!nm) { out.innerHTML = '<span class="err">Please type your full name first.</span>'; return; }
      if (mode === 'photo' && !photoSig) { out.innerHTML = '<span class="err">Please photograph your signature first.</span>'; return; }
      if (mode === 'draw' && !drawn) { out.innerHTML = '<span class="err">Please draw your signature in the box.</span>'; return; }
      btn.disabled = true; out.textContent = 'Sending…';
      fetch(URL0 + '/rest/v1/sign_requests?token=eq.' + encodeURIComponent(TOKEN), {
        method: 'PATCH', headers: Object.assign({ Prefer: 'return=representation' }, H),
        body: JSON.stringify((function () {
          var b = { signed: true, signer_name: nm, signature: mode === 'photo' ? photoSig : pad.toDataURL('image/png'), signed_at: new Date().toISOString() };
          if (MYC.length && window.__REP) {
            MYC.forEach(function (c) { c.by = nm; });
            b.payload = Object.assign({}, window.__REP, { tenantComments: (window.__REP.tenantComments || []).concat(MYC) });
          }
          return b;
        })())
      }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      }).then(function (upd) {
        if (!upd || !upd.length) throw new Error('gone');   // row withdrawn — don't show a false success
        document.querySelector('.sig').innerHTML = '<div class="k">DECLARATION</div><p class="ok" style="font-size:15px;">✓ Signed — thank you, ' + esc(nm) + '.</p><p>Your landlord or agent now has a record of your signature against this document. You can close this page; keep the link if you\u2019d like to re-read it.</p>';
        window.scrollTo(0, document.body.scrollHeight);
      }).catch(function (e) { btn.disabled = false; out.innerHTML = '<span class="err">' + (String(e && e.message) === 'gone' ? 'This signing request was withdrawn — ask for a fresh link.' : 'Could not send — check your connection and try again.') + '</span>'; });
    };
  }

  fetch(URL0 + '/rest/v1/sign_requests?token=eq.' + encodeURIComponent(TOKEN) + '&select=payload,signed,signer_name,expires_at', { headers: H })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (rows) {
      if (!rows.length) { msg('This signing link is no longer active.<br>It may have been completed or withdrawn — ask your landlord or agent for a fresh one.'); return; }
      var row = rows[0];
      if (row.expires_at && new Date(row.expires_at) < new Date()) { msg('This link has expired.<br>Ask your landlord or agent for a fresh one.'); return; }
      if (row.payload && row.payload.viewOnly) { render(row.payload, row); return; }
      if (row.signed) { msg('<span class="ok">✓ Already signed' + (row.signer_name ? ' by ' + esc(row.signer_name) : '') + '.</span><br>Nothing more to do — you can close this page.'); return; }
      render(row.payload || {}, row);
    })
    .catch(function () { msg('<span class="err">Could not load the document.</span><br>Check your connection, or ask for the link to be sent again.'); });
})();
